<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballistic</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; overflow: hidden;
               font-family: system-ui, -apple-system, sans-serif; }
  canvas { position: fixed; left: 0; top: 0; display: block; } /* sized in px by game.js, like the video */
  video { position: fixed; left: 0; top: 0; width: 0; height: 0; transform: scaleX(-1); object-fit: fill; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 18px; text-align: center; padding: 16px; background: #111; overflow-y: auto; }
  #start h1 { margin: 0; font-size: clamp(32px, 7vw, 72px); }
  #start p { margin: 0; max-width: 640px; line-height: 1.5; color: #bbb; }
  #start .games { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 920px; }
  #start button { flex: 1 1 320px; max-width: 440px; display: flex; flex-direction: column; gap: 8px; text-align: left;
                  font: inherit; padding: 18px 20px; border-radius: 12px; border: 0; color: #111; cursor: pointer; }
  #start button b { font-size: 24px; }
  #start button span { font-size: 15px; line-height: 1.45; }
  #start .pong { background: #46dc78; }
  #start .volley { background: #ff9632; }
  #start .juggle { background: #ffd23c; }
  #start .color { background: #46c3ff; }
  #start button:disabled { opacity: .5; cursor: default; }
  #err { color: #ff9632; min-height: 1.5em; }
  #report { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; gap: 10px;
            padding: 16px; background: rgba(0,0,0,.92); }
  #report[hidden] { display: none; }
  #report textarea { flex: 1; font: 11px ui-monospace, Menlo, monospace; background: #111; color: #ddd;
                     border: 1px solid #444; border-radius: 6px; padding: 8px; }
  #report div { display: flex; gap: 10px; }
  #report button { flex: 1; font: inherit; font-size: 18px; padding: 12px; border-radius: 8px; border: 0; }
  #report .copy { background: #46dc78; color: #111; }
  .keys { font-size: 14px; color: #888; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="start">
  <h1>Ballistic</h1>
  <div class="games">
    <button class="pong" data-game="pong"><b>Finger Pong</b>
      <span>Two players in front of a phone or laptop camera. Your paddle is the line between your thumb
        tip and index fingertip. Left player defends the left edge, right player the right (on a phone
        held upright: top and bottom). First to 7.</span></button>
    <button class="volley" data-game="volley"><b>Volleyball</b>
      <span>Full body, made for a projector with the laptop camera watching the players. Your paddle is the
        line between your hands (one hand: level with it across your head; none: just above your head).
        Any number per side; bop the ball up and over the net, a point when it lands on the other side.
        First to 11.</span></button>
    <button class="juggle" data-game="juggle"><b>Juggling</b>
      <span>Full body, everyone in view plays. Four coloured platforms on your hands and feet aim towards the
        opposite hand, and moving sideways shifts that angle left or right. Each ball gets one floor bounce;
        starts with one ball and adds more until the last ball is lost.</span></button>
    <button class="color" data-game="color"><b>Colour Juggle</b>
      <span>One ball, everyone in view plays. Each hand and foot has its own colour, and the ball changes colour
        to show which platform must bounce it next; it goes through the others. Three hearts: every floor
        bounce costs one.</span></button>
  </div>
  <div id="err"></div>
  <p class="keys">Keys: r new match · v video brightness · z camera zoom · c costume (body games) · h fire hands (Finger Pong) · d skeletons (or double-tap) · f fullscreen · m or Esc menu</p>
</div>
<div id="report" hidden>
  <textarea readonly></textarea>
  <div><button class="copy">Copy</button><button class="close">Close</button></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
